{% extends "base.html" %}
{% block title %}Tags · {{ config.title }}{% endblock title %}
{% block content %}
<h1>Tags</h1>
<ul class="tag-cloud">
  {% for term in terms %}
  <li><a href="{{ term.permalink | safe }}">#{{ term.name }}</a> <span class="muted">{{ term.pages | length }}</span></li>
  {% endfor %}
</ul>
{% endblock content %}
